name: DualPlayerData
version: 1.2
main: me.benjamin.dualplayerdata.DualPlayerData
api-version: 1.21
author: Benjamin (with Grok)
description: Dual UUID playerdata sync + mandatory password auth in offline mode

commands:
  login:
    description: Login with your password (offline mode)
    usage: /login <password>
  register:
    description: Register your password (first offline join)
    usage: /register <password> <confirm>
  changedatapass:
    description: Change your password
    usage: /changedatapass <old> <new> <confirm>
  datasync:
    description: Manually sync online/offline playerdata
    usage: /datasync <player> <online-to-offline|offline-to-online> [password]
  datasyncadmin:
    description: OP admin commands
    usage: /datasyncadmin resetpass <player>
